# DUSEL check-in — avtomatik testlar (faqat sinov bazalari; production'ga yozmaydi)
name: Check-in CI
on:
  push:
    branches: [checkin-backend]
  workflow_dispatch:
permissions:
  contents: read
env:
  PGHOST: localhost
  PGPORT: 5432
  PGUSER: postgres
  PGPASSWORD: postgres
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install "psycopg[binary]==3.2.13"
      - name: Sxema + 11 222 bilet (sinov bazasi)
        run: ./e2e/reset_db.sh ci_test
      - name: Ma'lumotlar bazasi testlari
        run: cd tests && python3 test_db.py "host=localhost port=5432 dbname=ci_test user=postgres password=postgres"
      - name: Sig'imni aylanib o'tish urinishlari (toza bazada, parallel)
        run: ./e2e/reset_db.sh ci_cap && cd tests && python3 test_capacity_attack.py "host=localhost port=5432 dbname=ci_cap user=postgres password=postgres"
      - name: Toza migratsiyadan keyin production tekshiruvi (muhit PRODUCTION qilib)
        run: |
          ./e2e/reset_db.sh ci_fresh
          psql -d ci_fresh -qc "update checkin.settings set value='\"PRODUCTION\"' where key='environment'"
          psql -d ci_fresh -At -f tools/production_verify.sql | tee verify.txt
          ! grep -q '^XATO' verify.txt
      - name: supabase/migrations sql/ bilan bir xil
        run: ./tools/sync_supabase_migrations.sh >/dev/null && git diff --exit-code supabase/migrations
      - name: Yuklama testi (16 parallel qurilma, 11 222 kirish)
        run: ./e2e/reset_db.sh ci_load && cd tests && python3 load_test.py "host=localhost port=5432 dbname=ci_load user=postgres password=postgres" 16
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: db-results, path: "tests/*.json" }
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: feature/checkin, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install segno==1.6.1 && ./e2e/make_media.sh e2e/media
      - run: cd e2e && npm init -y >/dev/null && npm install pg@8.13.1 playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: ./e2e/reset_db.sh ci_e2e seed
      - name: Brauzer testlari (xodim ilovasi + ommaviy sahifalar)
        run: |
          node e2e/mock_supabase.js "$GITHUB_WORKSPACE/site" 8799 ci_e2e > mock.log 2>&1 &
          sleep 2
          cd e2e && MEDIA_DIR="$GITHUB_WORKSPACE/e2e/media" node test_e2e.mjs http://127.0.0.1:8799 shots
      - name: Staging tutun testi (lokal HTTP taqlidida; haqiqiy staging'da xuddi shu skript)
        run: |
          cd tests && BASE=http://127.0.0.1:8799 ANON_KEY=local-test-anon-key OUT=../e2e/shots/staging_smoke_local.json \
            ACCOUNTS='{"admin":{"email":"admin@dusel.test","password":"Admin-Test-2026"},"sup":{"email":"sup@dusel.test","password":"Sup-Test-2026"},"gate":{"email":"gate1@dusel.test","password":"Gate-Test-2026"},"inv":{"email":"inv@dusel.test","password":"Inv-Test-2026"}}' \
            node staging_smoke.mjs
      - name: HTTP yuklama (8 darvoza, Auth + /rpc orqali, 20 mijoz poygasi)
        run: |
          ./e2e/reset_db.sh ci_http seed && psql -d ci_http -v ON_ERROR_STOP=1 -q -f e2e/seed_http_load.sql
          node e2e/mock_supabase.js "$GITHUB_WORKSPACE/site" 8800 ci_http > mock_http.log 2>&1 &
          sleep 2
          cd tests && GATES=$(python3 -c "import json;print(json.dumps([{'email':f'load-g{i}@dusel.test','password':'Load-Test-2026','gate':f'L{i}'} for i in range(1,9)]))") \
            ADMIN='{"email":"admin@dusel.test","password":"Admin-Test-2026"}' BASE=http://127.0.0.1:8800 OUT=../e2e/shots/http_load.json node http_load_test.mjs | tail -40
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: "e2e/shots" }
  production-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd tests && npm init -y >/dev/null && npm install playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Ommaviy sahifalar (bilet, GOLD/SILVER/GAL, 404) main va feature/checkin da bayt-ma-bayt bir xil
        run: |
          git fetch -q --depth=1 origin main feature/checkin
          git diff --exit-code --stat origin/main origin/feature/checkin -- index.html ticket.html 404.html gold.html silver.html coupon.html gal.html
          echo "OK: merge ommaviy sahifalarni o'zgartirmaydi"
      - name: Production faqat o'qish — tarixiy bilet QR formatlari, kuponlar, /checkin holati, staging preview
        run: cd tests && node prod_compat.mjs compat
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: production-compat, path: "tests/compat" }
  devices-https:
    # Haqiqiy HTTPS: Cloudflare staging preview (feature-checkin) + production faqat o'qish. WebKit = iPhone Safari dvigateli.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install segno==1.6.1 && ./e2e/make_media.sh e2e/media
      - name: Playwright brauzerlari (osilib qolsa — qayta urinish)
        timeout-minutes: 20
        run: |
          cd e2e && npm init -y >/dev/null && npm install playwright@1.63.0
          for i in 1 2 3; do timeout 360 npx playwright install --with-deps chromium webkit && break; echo "o'rnatish qayta ($i)"; sleep 10; done
      - uses: actions/checkout@v4
        with: { ref: feature/checkin, path: site }
      - name: iPhone Safari (WebKit) va Android Chrome (Chromium) — HTTPS orqali
        run: cd e2e && SITE_DIR="$GITHUB_WORKSPACE/site" node test_devices.mjs https://feature-checkin.dusel.pages.dev https://dusel.pages.dev devices "$GITHUB_WORKSPACE/e2e/media"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: devices-https, path: "e2e/devices" }
  staging-smoke:
    # Haqiqiy STAGING branch'da tutun testi. Yoqish: variable RUN_STAGING_SMOKE=1 + secrets STAGING_URL, STAGING_ANON_KEY, STAGING_ACCOUNTS (JSON)
    if: ${{ vars.RUN_STAGING_SMOKE == '1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: HTTPS tutun testi (staging)
        env:
          BASE: ${{ secrets.STAGING_URL }}
          ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
          ACCOUNTS: ${{ secrets.STAGING_ACCOUNTS }}
          OUT: staging_smoke.json
        run: cd tests && node staging_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: staging-smoke, path: tests/staging_smoke.json }
  cloud-load:
    # BULUT (HTTPS) yuklama — faqat STAGING branch'ga. Yoqish: repo variable RUN_CLOUD_LOAD=1 va secrets
    # STAGING_URL, STAGING_ANON_KEY, LOAD_GATES (JSON), LOAD_ADMIN (JSON); parametrlar: vars LOAD_PACE_MS, LOAD_TICKETS, LOAD_RACE.
    # Skript muhit PRODUCTION bo'lsa yoki baza toza bo'lmasa o'zini to'xtatadi.
    if: ${{ vars.RUN_CLOUD_LOAD == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: HTTPS yuklama (staging)
        env:
          BASE: ${{ secrets.STAGING_URL }}
          ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
          GATES: ${{ secrets.LOAD_GATES }}
          ADMIN: ${{ secrets.LOAD_ADMIN }}
          PACE_MS: ${{ vars.LOAD_PACE_MS || '3000' }}
          TICKETS: ${{ vars.LOAD_TICKETS || '1-11222' }}
          RACE: ${{ vars.LOAD_RACE || '20' }}
          OUT: cloud_load.json
        run: |
          test -n "$BASE" || { echo "STAGING_URL secret yo'q"; exit 1; }
          cd tests && node http_load_test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cloud-load, path: tests/cloud_load.json }
