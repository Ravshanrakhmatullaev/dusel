<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DUSEL GROUP — Bilet</title>
<style>body{background:#7a0008;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:16px}h1{font-size:22px;margin:0 0 8px}p{margin:0;opacity:.85;line-height:1.5}a{color:#fff}</style></head>
<body><main><h1 id="h">Bilet topilmadi</h1><p id="p">Biletdagi QR kodni qayta skanerlang.</p></main>
<script>
// Eski manzil (github.io) — faqat konsert biletlari uchun ishlatilgan. Bilet raqamini rasmiy bilet sahifasiga uzatadi:
//   https://ravshanrakhmatullaev.github.io/dusel/?code=NNNNN  →  https://dusel.pages.dev/ticket?code=NNNNN
// Boshqa hech qanday mahsulotga (GAL, GOLD, SILVER) yo'naltirmaydi.
(function () {
  var c = new URLSearchParams(location.search).get('code') || '';
  if (/^\d{5}$/.test(c) && +c >= 1 && +c <= 11222) {
    document.getElementById('h').textContent = 'Bilet № ' + c;
    document.getElementById('p').innerHTML = 'Ochilmoqda… <a href="https://dusel.pages.dev/ticket?code=' + c + '">dusel.pages.dev</a>';
    location.replace('https://dusel.pages.dev/ticket?code=' + c);
  }
})();
</script></body></html>
