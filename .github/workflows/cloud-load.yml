# DUSEL — BULUT (HTTPS) yuklama testi: faqat qo'lda ishga tushiriladi, faqat STAGING branch'ga.
# Kerakli repository secrets: STAGING_URL, STAGING_ANON_KEY, LOAD_GATES (JSON), LOAD_ADMIN (JSON).
# Skript muhit PRODUCTION bo'lsa yoki baza toza bo'lmasa o'zini to'xtatadi.
name: Cloud load test (staging)
on:
  workflow_dispatch:
    inputs:
      pace_ms: { description: "Darvoza bo'yicha skanlar orasidagi pauza (ms). 3000 = haqiqiy sur'at, 0 = stress", default: "3000" }
      tickets: { description: "Bilet oralig'i", default: "1-11222" }
      race: { description: "Bir biletga bir vaqtda mijozlar", default: "20" }
permissions:
  contents: read
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: HTTPS yuklama
        env:
          BASE: ${{ secrets.STAGING_URL }}
          ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
          GATES: ${{ secrets.LOAD_GATES }}
          ADMIN: ${{ secrets.LOAD_ADMIN }}
          PACE_MS: ${{ inputs.pace_ms }}
          TICKETS: ${{ inputs.tickets }}
          RACE: ${{ inputs.race }}
          OUT: cloud_load.json
        run: |
          test -n "$BASE" || { echo "STAGING_URL secret yo'q — staging hali yaratilmagan"; exit 1; }
          cd tests && node http_load_test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cloud-load, path: tests/cloud_load.json }
